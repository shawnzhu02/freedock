name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run check
      - run: cargo test
        working-directory: src-tauri
      - run: npm run tauri build
      - name: Portable zip
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force dist-portable | Out-Null
          Copy-Item src-tauri/target/release/freedock.exe dist-portable/
          Copy-Item LICENSE dist-portable/
          Compress-Archive -Path dist-portable/* -DestinationPath "freedock-$v-portable-x64.zip"
      - uses: softprops/action-gh-release@v2
        with:
          name: freedock ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            freedock-*-portable-x64.zip
