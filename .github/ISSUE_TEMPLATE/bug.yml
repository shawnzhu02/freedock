name: Bug
description: Something doesn't work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: version
    attributes:
      label: freedock version and Windows version (e.g. 0.1.0, Windows 11 24H2)
  - type: textarea
    id: setup
    attributes:
      label: Setup
      description: Number of monitors and their scaling, dock position and style, widgets involved.
  - type: textarea
    id: log
    attributes:
      label: popup.log (for flyout problems)
      description: 'The end of `%APPDATA%\freedock\popup.log`: it traces every flyout open and close.'
      render: text
  - type: markdown
    attributes:
      value: "If the Windows taskbar stays hidden, run `freedock.exe --restore-taskbar`. Want to fix it yourself? Point your coding agent at AGENTS.md (it has a Debug a bug section) and this issue."
