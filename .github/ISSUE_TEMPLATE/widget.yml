name: Widget idea
description: A widget, flyout or setting you'd like
labels: [idea]
body:
  - type: markdown
    attributes:
      value: "Want it today? Ask your coding agent: *Read AGENTS.md and add a widget that ...*. `npm run new:widget -- \"Name\"` scaffolds it. Pull requests are welcome."
  - type: textarea
    id: idea
    attributes:
      label: What should it show or do?
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Where does the data come from?
      description: Built-in widgets use APIs that need no key or account. Ideas that need one are still welcome as recipes in docs/CUSTOMIZING.md.
