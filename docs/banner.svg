<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset=".55" stop-color="#16123a"/>
      <stop offset="1" stop-color="#0a2a3a"/>
    </linearGradient>
    <radialGradient id="b1" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#7c5cff" stop-opacity=".85"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/></radialGradient>
    <radialGradient id="b2" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#00d4c8" stop-opacity=".7"/><stop offset="1" stop-color="#00d4c8" stop-opacity="0"/></radialGradient>
    <radialGradient id="b3" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff5fa2" stop-opacity=".6"/><stop offset="1" stop-color="#ff5fa2" stop-opacity="0"/></radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".1"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9d6ff"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="shadow" x="-20%" y="-50%" width="140%" height="220%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".45"/></filter>
    <clipPath id="pill"><rect x="250" y="438" width="780" height="92" rx="46"/></clipPath>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="300" cy="170" r="300" fill="url(#b1)" filter="url(#blur)"/>
  <circle cx="1040" cy="460" r="320" fill="url(#b2)" filter="url(#blur)"/>
  <circle cx="820" cy="120" r="230" fill="url(#b3)" filter="url(#blur)"/>

  <g font-family="Segoe UI Variable Display, Segoe UI, Inter, system-ui, sans-serif" text-anchor="middle">
    <text x="640" y="228" font-size="128" font-weight="700" letter-spacing="-4" fill="url(#word)">freedock</text>
    <text x="640" y="290" font-size="32" font-weight="500" fill="#dfe6ff" fill-opacity=".88">The free, infinitely customizable dock for Windows</text>
    <text x="640" y="344" font-size="20" font-weight="600" letter-spacing="3" fill="#9fb3ff" fill-opacity=".8">OPEN SOURCE · MIT · BUILT TO BE REMIXED BY YOUR CODING AGENT</text>
  </g>

  <!-- The dock: a glass pill with app tiles and widget cells -->
  <g filter="url(#shadow)">
    <rect x="250" y="438" width="780" height="92" rx="46" fill="url(#glass)"/>
  </g>
  <g clip-path="url(#pill)">
    <circle cx="420" cy="420" r="120" fill="#7c5cff" fill-opacity=".18" filter="url(#blur)"/>
    <circle cx="900" cy="560" r="120" fill="#00d4c8" fill-opacity=".16" filter="url(#blur)"/>
  </g>
  <rect x="250.5" y="438.5" width="779" height="91" rx="45.5" fill="none" stroke="url(#rim)" stroke-width="1.5"/>

  <!-- Start -->
  <g transform="translate(290 466)" fill="#ffffff" fill-opacity=".92">
    <rect x="0" y="0" width="16" height="16" rx="3.5"/><rect x="20" y="0" width="16" height="16" rx="3.5"/>
    <rect x="0" y="20" width="16" height="16" rx="3.5"/><rect x="20" y="20" width="16" height="16" rx="3.5"/>
  </g>
  <!-- Apps -->
  <g>
    <rect x="352" y="459" width="50" height="50" rx="14" fill="#3b82f6"/>
    <path d="M366 474h22v4h-22zM366 482h16v4h-16zM366 490h20v4h-20z" fill="#fff" fill-opacity=".9"/>
    <rect x="414" y="459" width="50" height="50" rx="14" fill="#f59e0b"/>
    <path d="M427 476h10l4 4h11v15h-25z" fill="#fff" fill-opacity=".92"/>
    <rect x="476" y="459" width="50" height="50" rx="14" fill="#10b981"/>
    <path d="M492 474l12 10-12 10z" fill="#fff" fill-opacity=".92"/>
    <rect x="538" y="459" width="50" height="50" rx="14" fill="#ec4899"/>
    <circle cx="563" cy="484" r="11" fill="none" stroke="#fff" stroke-opacity=".92" stroke-width="4"/>
    <circle cx="377" cy="520" r="2.5" fill="#fff" fill-opacity=".85"/>
    <circle cx="501" cy="520" r="2.5" fill="#fff" fill-opacity=".85"/>
  </g>
  <rect x="608" y="462" width="1.5" height="44" fill="#fff" fill-opacity=".25"/>
  <!-- Widgets: weather, CPU, date and time -->
  <g font-family="Segoe UI Variable Text, Segoe UI, Inter, system-ui, sans-serif">
    <rect x="626" y="458" width="132" height="52" rx="16" fill="#ffffff" fill-opacity=".1"/>
    <circle cx="652" cy="484" r="10" fill="#fcd34d"/>
    <text x="674" y="479" font-size="12" font-weight="700" fill="#cfe0ff" letter-spacing="1">SUNNY</text>
    <text x="674" y="499" font-size="19" font-weight="650" fill="#fff">21°</text>
    <rect x="770" y="458" width="100" height="52" rx="16" fill="#ffffff" fill-opacity=".1"/>
    <text x="786" y="479" font-size="12" font-weight="700" fill="#cfe0ff" letter-spacing="1">CPU</text>
    <path d="M786 498 l10 -6 l10 4 l10 -10 l10 6 l10 -3 l8 2" fill="none" stroke="#5eead4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="882" y="458" width="126" height="52" rx="16" fill="#ffffff" fill-opacity=".1"/>
    <text x="945" y="479" font-size="12" font-weight="700" fill="#cfe0ff" letter-spacing="1" text-anchor="middle">MON 16</text>
    <text x="945" y="501" font-size="21" font-weight="650" fill="#fff" text-anchor="middle">9:41</text>
  </g>
</svg>
